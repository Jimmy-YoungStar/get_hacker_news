name: Daily IT News Automation

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 时间 0点（北京时间早上 8 点）自动运行
  workflow_dispatch: # 允许你在 GitHub 网页上手动点一下立即运行

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖库
        run: |
          pip install feedparser gspread openai

      - name: 运行主脚本
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Google 的凭证可以安全地存在 GitHub Secrets 中
        run: |
          python main.py

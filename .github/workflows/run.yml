name: Daily IT News Automation

on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间早上 8 点运行
  workflow_dispatch: # 允许你随时在网页上手动点一下测试

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖库
        run: |
          pip install feedparser gspread openai

      - name: 生成 Google 凭证文件
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "$GCP_SA_KEY" > credentials.json

      - name: 运行主脚本
        env:
          GEMINI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python main.py
